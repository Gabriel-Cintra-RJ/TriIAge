[project]
name = "triiage-backend"
version = "0.1.0"
description = "Backend do TriIAge: pré-consulta (sintomas -> urgência) e pós-consulta (remédios -> bula) com o JEV"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.2",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.4",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
