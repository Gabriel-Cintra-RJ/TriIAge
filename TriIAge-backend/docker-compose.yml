services:
  db:
    image: postgres:17
    container_name: triage_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # scripts que criam as tabelas e carregam os CSVs (só rodam na primeira vez, com o volume vazio)
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/csv:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: triage_python_jev
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # só para desenvolvimento: a API reinicia sozinha quando salvamos um arquivo. Tirar em produção.
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
